services:
  - type: web
    name: ability-race
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: ability-race-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      - key: KECCAK_CTRL
        sync: false
      - key: ORGANIZER_TOKEN
        sync: false
      - key: ADMIN_LOCKED
        value: "false"

databases:
  - name: ability-race-db
    databaseName: ability_race
    plan: free
